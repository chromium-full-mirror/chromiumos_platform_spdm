[workspace]
members = ["spdm-core", "spdm-types"]

[package]
name = "spdm-eal"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2021"

[lib]
name = "spdm"
crate-type = ["staticlib"]

[dependencies]
spdm = { path = "spdm-core", default-features = false }
spdm-types = { path = "spdm-types" }
uninit = { version = "0.5", default-features = false }

[features]
default = ["std"]
std = []

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
