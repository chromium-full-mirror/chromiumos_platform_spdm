[workspace]
members = [
  "spdm-core",
  "spdm-proc-macros",
  "spdm-responder-ffi",
  "spdm-responder",
  "spdm-types",
  "test-deps",
]
default-members = [
  "spdm-core",
  "spdm-proc-macros",
  "spdm-responder-ffi",
  "spdm-responder",
  "spdm-types",
]

resolver = "2"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
